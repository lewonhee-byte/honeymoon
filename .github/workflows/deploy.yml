name: Deploy archive
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  initialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Import initial source package
        shell: bash
        run: |
          if [ -f source.zip ] && [ ! -f package.json ]; then
            unzip -o source.zip
            git rm source.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html config.js css js data images scripts tests worker README.md VERIFICATION.md package.json .gitignore
            git commit -m "Import complete honeymoon archive source"
            git push origin HEAD:main
          fi
  deploy:
    needs: initialize
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tests/verify.mjs
      - run: node tests/client.mjs
      - run: node scripts/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
